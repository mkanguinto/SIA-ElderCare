# ElderCare Connect - full local stack
#   cp .env.example .env    (then fill in secrets / API keys)
#   docker compose up --build
# Public entry point: http://localhost:8080  (API Gateway)
# RabbitMQ management UI: http://localhost:15672  (user/password from RABBITMQ_USER / RABBITMQ_PASSWORD)
#
# Data isolation (Section 9 / Section 18, professor's evaluation):
#   one PostgreSQL container per microservice, and inside each one a dedicated NON-superuser login
#   (checkin_svc / alert_svc / clinic_svc) created by infra/postgres/10-app-role.sh. Services never see
#   the admin password or another service's password.  Verify: npm run verify:db-isolation
#   (Upgrading from v1? run `docker compose down -v` once so the init script can create the roles.)

x-node-service: &node-service
  restart: unless-stopped
  networks: [internal]

services:
  # ------------------------------ Databases ------------------------------
  checkin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: checkin_db
      POSTGRES_USER: checkin_admin                     # bootstrap only, never given to a service
      POSTGRES_PASSWORD: "${CHECKIN_DB_ADMIN_PASSWORD:-checkin_admin_pass}"
      APP_DB_USER: checkin_svc                         # the only login the checkin service has
      APP_DB_PASSWORD: "${CHECKIN_DB_PASSWORD:-checkin_pass}"
    volumes: ["checkin-data:/var/lib/postgresql/data", "./infra/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro"]
    ports: ["5433:5432"]           # dev only - remove in production
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U checkin_admin -d checkin_db"], interval: 5s, retries: 10 }
    networks: [internal]

  alert-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alert_db
      POSTGRES_USER: alert_admin                     # bootstrap only, never given to a service
      POSTGRES_PASSWORD: "${ALERT_DB_ADMIN_PASSWORD:-alert_admin_pass}"
      APP_DB_USER: alert_svc                         # the only login the alert service has
      APP_DB_PASSWORD: "${ALERT_DB_PASSWORD:-alert_pass}"
    volumes: ["alert-data:/var/lib/postgresql/data", "./infra/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro"]
    ports: ["5434:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U alert_admin -d alert_db"], interval: 5s, retries: 10 }
    networks: [internal]

  clinic-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic_db
      POSTGRES_USER: clinic_admin                     # bootstrap only, never given to a service
      POSTGRES_PASSWORD: "${CLINIC_DB_ADMIN_PASSWORD:-clinic_admin_pass}"
      APP_DB_USER: clinic_svc                         # the only login the clinic service has
      APP_DB_PASSWORD: "${CLINIC_DB_PASSWORD:-clinic_pass}"
    volumes: ["clinic-data:/var/lib/postgresql/data", "./infra/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro"]
    ports: ["5435:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U clinic_admin -d clinic_db"], interval: 5s, retries: 10 }
    networks: [internal]

  # ------------------------------ Middleware ------------------------------
  # RabbitMQ: topic exchange eldercare.events, per-service durable queues, retry tiers and DLQs
  # (declared by the services on start-up - see docs/MESSAGING.md).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: eldercare-rabbitmq            # fixed node name so the durable data volume is reused
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-eldercare}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-eldercare_pass}"
      RABBITMQ_DEFAULT_VHOST: eldercare
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    ports: ["5672:5672", "15672:15672"]     # dev only: AMQP + management UI
    # rabbitmq-diagnostics boots an Erlang CLI node, which can take ~20 s on Docker Desktop
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 15s, timeout: 45s, start_period: 90s, retries: 12 }
    networks: [internal]

  # ------------------------------ Services -------------------------------
  api-gateway:
    <<: *node-service
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      NODE_ENV: production
      SERVICE_NAME: api-gateway
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      JWT_ALGORITHM: HS256
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-7d}"
      # kid-based key rotation (docs/SECURITY.md): active kid signs, JWT_PREVIOUS_KEYS only verify
      JWT_KID: "${JWT_KID:-k1}"
      JWT_PREVIOUS_KEYS: "${JWT_PREVIOUS_KEYS:-}"
      JWT_REFRESH_KID: "${JWT_REFRESH_KID:-r1}"
      JWT_PREVIOUS_REFRESH_KEYS: "${JWT_PREVIOUS_REFRESH_KEYS:-}"
      JWT_KEY_ROTATED_AT: "${JWT_KEY_ROTATED_AT:-}"
      JWT_KEY_ROTATION_DAYS: "${JWT_KEY_ROTATION_DAYS:-90}"
      REFRESH_REUSE_GRACE_SECONDS: "${REFRESH_REUSE_GRACE_SECONDS:-10}"
      # revoked tokens + refresh sessions survive gateway restarts
      TOKEN_STORE_FILE: /app/state/token-store.json
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}"
      CHECKIN_SERVICE_URL: http://checkin-service:4001
      ALERT_SERVICE_URL: http://alert-service:4002
      CLINIC_SERVICE_URL: http://clinic-risk-service:4003
      LEGACY_ADAPTER_URL: http://legacy-emr-adapter:4004
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-300}"
    volumes: ["gateway-state:/app/state"]
    depends_on: [checkin-service, alert-service, clinic-risk-service]
    networks: [internal, public]

  checkin-service:
    <<: *node-service
    build: ./services/checkin-service
    environment:
      PORT: 4001
      SERVICE_NAME: checkin-service
      DATABASE_URL: "postgres://checkin_svc:${CHECKIN_DB_PASSWORD:-checkin_pass}@checkin-db:5432/checkin_db"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN}"
      EVENT_TRANSPORT: rabbitmq
      AMQP_URL: "amqp://${RABBITMQ_USER:-eldercare}:${RABBITMQ_PASSWORD:-eldercare_pass}@rabbitmq:5672/eldercare"
      ALERT_SERVICE_URL: http://alert-service:4002
      CLINIC_SERVICE_URL: http://clinic-risk-service:4003
    depends_on:
      checkin-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  alert-service:
    <<: *node-service
    build: ./services/alert-service
    environment:
      PORT: 4002
      SERVICE_NAME: alert-service
      NODE_ENV: "${ALERT_NODE_ENV:-development}"   # development => SMS simulated unless the number is allow-listed
      DATABASE_URL: "postgres://alert_svc:${ALERT_DB_PASSWORD:-alert_pass}@alert-db:5432/alert_db"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN}"
      CHECKIN_SERVICE_URL: http://checkin-service:4001
      CLINIC_SERVICE_URL: http://clinic-risk-service:4003
      EVENT_TRANSPORT: rabbitmq
      AMQP_URL: "amqp://${RABBITMQ_USER:-eldercare}:${RABBITMQ_PASSWORD:-eldercare_pass}@rabbitmq:5672/eldercare"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY:-}"
      OPENWEATHER_ONECALL_ENABLED: "${OPENWEATHER_ONECALL_ENABLED:-false}"
      WEATHER_POLL_INTERVAL_MINUTES: "${WEATHER_POLL_INTERVAL_MINUTES:-30}"
      # heat / storm thresholds are alert rules now: GET/PATCH /api/alerts/rules (admin)
      SMS_DRY_RUN: "${SMS_DRY_RUN:-true}"
      SMS_PROVIDER: "${SMS_PROVIDER:-}"
      TEXTBEE_API_KEY: "${TEXTBEE_API_KEY:-}"
      TEXTBEE_DEVICE_ID: "${TEXTBEE_DEVICE_ID:-}"
      TEXTBEE_BASE_URL: "${TEXTBEE_BASE_URL:-https://api.textbee.dev/api/v1}"
      TEXTBEE_SIM_SUBSCRIPTION_ID: "${TEXTBEE_SIM_SUBSCRIPTION_ID:-}"
      TEXTBEE_WEBHOOK_SECRET: "${TEXTBEE_WEBHOOK_SECRET:-}"
      TEXTBEE_VALIDATE_WEBHOOK: "${TEXTBEE_VALIDATE_WEBHOOK:-true}"
      SMS_RECIPIENT_ALLOWLIST: "${SMS_RECIPIENT_ALLOWLIST:-}"
      SMS_DAILY_LIMIT: "${SMS_DAILY_LIMIT:-40}"
      SMS_RETRY_ON_TIMEOUT: "${SMS_RETRY_ON_TIMEOUT:-false}"
    depends_on:
      alert-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  clinic-risk-service:
    <<: *node-service
    build: ./services/clinic-risk-service
    environment:
      PORT: 4003
      SERVICE_NAME: clinic-risk-service
      DATABASE_URL: "postgres://clinic_svc:${CLINIC_DB_PASSWORD:-clinic_pass}@clinic-db:5432/clinic_db"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN}"
      EVENT_TRANSPORT: rabbitmq
      AMQP_URL: "amqp://${RABBITMQ_USER:-eldercare}:${RABBITMQ_PASSWORD:-eldercare_pass}@rabbitmq:5672/eldercare"
      LEGACY_ADAPTER_URL: http://legacy-emr-adapter:4004
      ENV_RISK_TTL_HOURS: "${ENV_RISK_TTL_HOURS:-24}"
      RECENT_VISIT_DAYS: "${RECENT_VISIT_DAYS:-30}"
      VISIT_TZ_OFFSET: "${VISIT_TZ_OFFSET:-+08:00}"
    depends_on:
      clinic-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  legacy-emr-adapter:
    <<: *node-service
    build: ./services/legacy-emr-adapter
    ports: ["4004:4004"]           # dev only - lets SoapUI hit /legacy/translate
    environment:
      PORT: 4004
      SERVICE_NAME: legacy-emr-adapter
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN}"
      LEGACY_EMR_URL: "${LEGACY_EMR_URL:-http://mock-legacy-emr:4005/emr}"
      LEGACY_EMR_USERNAME: "${LEGACY_EMR_USERNAME:-}"
      LEGACY_EMR_PASSWORD: "${LEGACY_EMR_PASSWORD:-}"

  mock-legacy-emr:
    <<: *node-service
    build: ./services/mock-legacy-emr
    ports: ["4005:4005"]           # SoapUI target (WSDL at http://localhost:4005/emr?wsdl)
    environment:
      PORT: 4005
      PUBLIC_URL: http://localhost:4005/emr
      MOCK_EMR_DELAY_MS: "${MOCK_EMR_DELAY_MS:-0}"
      MOCK_EMR_FAIL_RATE: "${MOCK_EMR_FAIL_RATE:-0}"

networks:
  internal: {}
  public: {}

volumes:
  checkin-data: {}
  alert-data: {}
  clinic-data: {}
  rabbitmq-data: {}
  gateway-state: {}
