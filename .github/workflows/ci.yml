# CI pipeline (Section 16 / 18): test every service on each push / pull request to main,
# then verify every Docker image builds.
name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Shared middleware code (message bus, outbox, idempotency) and the event contracts are copied into
  # each service by scripts/sync-shared.js. Fail if a service's copy drifted from /shared or /contracts.
  contracts-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-shared.js
      - name: Shared code and event contracts are in sync
        run: git diff --exit-code -- services api-gateway integration
      - name: Event contracts are valid JSON
        run: for f in contracts/events/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done


  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, services/checkin-service, services/alert-service, services/clinic-risk-service, services/legacy-emr-adapter, services/care-plan-service, integration/node-red]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci when a lock file is committed, npm install otherwise (batch 1 removed stale locks; commit the regenerated ones)
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: |
          cp .env.example .env
          docker compose build

  integration:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp .env.example .env
          sed -i 's/^INTERNAL_SERVICE_TOKEN=.*/INTERNAL_SERVICE_TOKEN=ci-internal-token/' .env
          sed -i 's/^TEXTBEE_WEBHOOK_SECRET=.*/TEXTBEE_WEBHOOK_SECRET=ci-textbee-secret/' .env
          sed -i 's/^DASHBOARD_PASSWORD=.*/DASHBOARD_PASSWORD=ci-dashboard-password/' .env
          docker compose up -d --build
          for i in $(seq 1 40); do curl -sf http://localhost:8080/health && break; sleep 3; done
          sleep 10
      - name: Run Postman collection (Newman)
        run: |
          npx --yes newman run testing/postman/ElderCare_Connect.postman_collection.json \
            -e testing/postman/ElderCare_Connect.local.postman_environment.json --bail
      # End-to-end flows: triage de-escalation on normal vitals, visit scheduling, Recent visits,
      # case history, medicines, onboarding, RBAC. SMS stays in dry-run (no TextBee secrets in CI).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: End-to-end smoke test
        env:
          TEXTBEE_WEBHOOK_SECRET: ci-textbee-secret
          DASHBOARD_PASSWORD: ci-dashboard-password
          NODE_RED_URL: http://localhost:1880
        run: node testing/e2e-smoke.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
