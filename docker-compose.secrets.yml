# Docker secrets for the signing keys and the internal service token (Batch 2, secret management).
#
#   npm run secrets:generate          # writes random values to ./secrets/ (git-ignored, mode 600)
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build
#
# Each service reads NAME_FILE=/run/secrets/<name> at start-up (shared/secrets.js); the file wins over
# the plain NAME variable, so .env only needs placeholder values for these three.
# Secrets are mounted read-only in /run/secrets (tmpfs), never baked into images or shown by
# `docker inspect`, unlike environment variables.

secrets:
  jwt_secret: { file: ./secrets/jwt_secret }
  jwt_refresh_secret: { file: ./secrets/jwt_refresh_secret }
  internal_service_token: { file: ./secrets/internal_service_token }

services:
  api-gateway:
    secrets: [jwt_secret, jwt_refresh_secret, internal_service_token]
    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token

  checkin-service:
    secrets: [internal_service_token]
    environment:
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token

  alert-service:
    secrets: [internal_service_token]
    environment:
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token

  clinic-risk-service:
    secrets: [internal_service_token]
    environment:
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token

  care-plan-service:
    secrets: [internal_service_token]
    environment:
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token

  node-red:
    secrets: [internal_service_token]
    environment:
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token

  legacy-emr-adapter:
    secrets: [internal_service_token]
    environment:
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
